version: "3.8"

services:
  api:
    build: ./backend
    # Port interne uniquement, accessible via le réseau Docker
    expose:
      - "8000"
    environment:
      - MONGODB_URL=mongodb://mongodb-uxmpc:27017
      - DATABASE_NAME=uxmcp
      - MCP_SERVER_URL=http://api:8000/mcp
      - REDIS_URL=redis://redis:6379
    depends_on:
      - mongodb-uxmpc
      - redis
    volumes:
      - ./backend:/app
      - chromadb_data:/data/chromadb
      - python_deps:/usr/local/lib/python3.11/site-packages
      - ./dynamic_requirements.txt:/app/dynamic_requirements.txt
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    build: ./frontend
    ports:
      - "5174:5173"
    # Pas de VITE_API_URL - le proxy Vite gère la redirection
    volumes:
      - ./frontend:/app
      - /app/node_modules
    command: npm run dev -- --host

  mongodb-uxmpc:
    image: mongo:7
    # Port interne uniquement
    expose:
      - "27017"
    environment:
      - MONGO_INITDB_DATABASE=uxmcp
    volumes:
      - mongo_data:/data/db

  redis:
    image: redis:7-alpine
    # Port interne uniquement
    expose:
      - "6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru


volumes:
  mongo_data:
  chromadb_data:
  python_deps:
  redis_data: